[spirv]
; --- Базовые запреты (FAKE-им то, чего нет на GCN2) ---
DenyFloat16=0
DenyInt16=0
DenyDotProduct=1
DenyRayTracing=1
DenyMesh=1

; --- Понижение 16-битной арифметики до 32-бит (КРИТИЧНО для idTech) ---
; Включено по умолчанию — переписывает fp16/int16 ALU -> fp32/int32,
; память остаётся 16-битной. Без этого меню/интерфейс будут чёрными.
LowerFp16AndInt16=1
LowerFp16=1
PromoteFloat16=0
DropF16Cap=0

; --- [SWRT] Программная трассировка лучей (НОВОЕ) ---
; 1 = OpRayQuery* в шейдерах заменяются программным обходом BVH. Прокси строит BVH
;     (BLAS/TLAS) compute-шейдерами из vkCmdBuildAccelerationStructuresKHR.
;     Если шейдер переписать не удалось - он падает обратно на вырезание лучей (как раньше).
; 0 = старое поведение (лучи вырезаются, "ничего не попало").
SoftwareRT=1
; Переключатели для поиска причины крашей (меняйте по одному):
;   SoftwareRT=0           - вся новая логика выключена (поведение как до моих правок)
;   SwrtPatchBuffers=0     - не трогать usage-флаги буферов в vkCreateBuffer
;   SwrtForceFeatures=1    - принудительно включать shaderInt64/BDA/scalarBlockLayout (по умолчанию 0)
SwrtPatchBuffers=1
SwrtForceFeatures=0

; Эксперимент: перенаправлять два распознанных нулевых вызова RT на реализации
; прокси после проверки аргументов. 0 = старое поведение; 1 = включить для теста.
; Не гарантирует исправление и может привести к сбою. Для проверки сначала SoftwareRT=0.
RecoverMissingASCalls=0

; --- Ray Query: переписываем, а не FAKE-им ---
; Позволяет шейдерам освещения работать (просто "ничего не попало").
RewriteRayQuery=1

; --- SPIR-V версия: 1.6 -> 1.5 (AMDVLK для GCN2 знает только 1.5) ---
PatchVersion=1

; --- Защита от зависаний (КРИТИЧНО для Doom TDA) ---
; Compute-шейдеры denoiser'а в Doom весят 80k-100k слов SPIR-V и вешают
; LLPC на GCN2 на 40+ минут. FAKE-им их сразу.
; На R7 260X меню появилось при 61000; более высокое значение в другом запуске зависало.
; ВАЖНО: порог сравнивается с ИСХОДНЫМ размером шейдера (до вставки программной
; трассировки, которая добавляет ~8k слов), чтобы SoftwareRT не перекинул шейдеры в FAKE.
HeavyComputeWords=61000

; Эксперимент: сохранить до 8 пропущенных compute-модулей в SPIR-V (0 = выключено).
; OptimizedComputeHash оставляйте пустым до отдельной проверки одного кандидата.
DumpHeavyCompute=0
OptimizedComputeHash=
; Дополнительный точный хеш, выключен по умолчанию.
OptimizedComputeHash2=
; Третий точный хеш, выключен по умолчанию.
OptimizedComputeHash3=
; Четвёртый точный хеш, выключен по умолчанию.
OptimizedComputeHash4=
; Пятый точный хеш, выключен по умолчанию.
OptimizedComputeHash5=
; Шестой точный хеш, выключен по умолчанию.
OptimizedComputeHash6=
; Седьмой точный хеш, выключен по умолчанию.
OptimizedComputeHash7=
; Опция по умолчанию пуста; не используйте feaa68b92e2af0bc: сообщалось о зависании драйвера.
OptimizedComputeHash8=
; Точный opt-in для отдельных graphics-модулей, по умолчанию выключен.
GraphicsCap49VertexHash=
GraphicsCap49FragmentHash=
ComputeTimeoutSec=12
HeavyShaderWords=0
CompileTimeoutSec=45
MaxAbandoned=4
PinStuckThreads=1

; --- Параллелизм компиляции ---
; На 4-ядерном CPU ставим 2 параллельных вызова драйвера.
; SerializeCompile=-1 (авто) или 0 (без лимита). 1 = строго по одному (медленно).
SerializeCompile=-1
CompileThreads=2

; --- Pipeline cache (ОБЯЗАТЕЛЬНО) ---
; Без него каждый запуск = компиляция тысяч шейдеров по 5-60 сек.
; Кэш сохраняется в VulkanProxy_pipeline.cache рядом с dll.
PipelineCache=1

; --- Watchdog и диагностика ---
Watchdog=1
StallDumpSec=20
CatchDriverCrash=1

; --- Запасные варианты ---
; Если драйвер отвергает шейдер — пробуем альтернативные переписывания.
TryVariants=1
KeepShaderCode=1

; --- Пост-обработка ---
; Пока программная трассировка не даёт картинку (тяжёлые compute-шейдеры освещения всё ещё FAKE),
; оставляйте 1.25 - иначе сцена слишком тёмная.
BrightnessGain=1.25

; --- Логирование ---
Verbose=0
LogAll=0
DumpRewrite=0
DumpRewriteFail=3
DumpSamples=0
UseReplacements=1

[rt]
; --- Заполнение RT-выходов (КРИТИЧНО) ---
; Fill=1 нужен всегда, пока освещение не считается по-настоящему: без заливки экран чёрный.
; (Ставьте 0 только когда SoftwareRT реально выдаёт освещение, иначе заливка его затрёт.)
Fill=1
; 0 = серый ambient, 1 = чёрный, 2 = голубоватый (небо-подобный)
FillMode=2
Ambient=35
; Чистить каждый кадр (иначе на статичных сценах RT-выходы "застревают")
EveryFrame=1
Log=1